schema: spec-driven

context: |
  Project: Minecraft Admin TUI, a Python/Textual desktop terminal interface for administering Minecraft Java servers in Podman or Docker containers.
  Core capabilities include server discovery, RCON actions, player/world management, settings, and backups.
  Keep proposals aligned with the existing Python application and its container/RCON boundaries; avoid assuming container recreation is safe.
  Language: English
  All artifacts must be written in English.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

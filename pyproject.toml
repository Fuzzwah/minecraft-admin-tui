[project]
name = "minecraft-admin-tui"
version = "0.2.0"
description = "Textual Minecraft Java server admin cockpit over Podman/RCON"
requires-python = ">=3.10"
dependencies = [
    "textual==8.2.8",
]

[project.scripts]
mc-admin-tui = "mc_admin_tui:main"
mc-give-tui = "mc_admin_tui:main"
mc-hub = "mc_hub:main"
mc-hub-deploy = "mc_hub_deploy:main"

[tool.setuptools]
py-modules = ["mc_admin_tui", "mc_admin_core", "mc_give_tui", "mc_hub", "mc_hub_world", "mc_hub_deploy"]

[tool.setuptools.package-data]
"*" = ["registries.json"]

